[project]
name = "edith"
version = "0.1.0"
description = "E.D.I.T.H. - An advanced agentic AI assistant framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.4.1",
    "livekit-agents>=0.8.0",
    "google-genai>=0.1.1",
    "openai>=1.12.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "typer>=0.9.0",
    "httpx>=0.27.0",
]

[project.scripts]
edith = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
